<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuAck - Corporate Document System</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  
  <!-- ========================================== -->
  <!-- 1. ส่วน HTML หลัก (App Container) -->
  <!-- ========================================== -->
  <div id="global-loader" class="fixed inset-0 z-[100] bg-slate-900 flex flex-col items-center justify-center text-white">
    <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
    <h2 class="text-xl font-bold mb-2">กำลังเชื่อมต่อฐานข้อมูล...</h2>
    <p class="text-slate-400 text-sm">ระบบกำลังดึงข้อมูลจาก Google Sheets</p>
  </div>

  <div id="app"></div>
  <div id="modal-container"></div>

  <!-- ========================================== -->
  <!-- 2. ส่วน CSS ตกแต่ง (จัดวางส่วนท้ายของโครงสร้าง UI) -->
  <!-- ========================================== -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Sarabun', sans-serif;
    }
    
    /* Semantic Class Naming สำหรับการแสดงผลป้ายสถานะ */
    .rama-badge-very-urgent { background-color: #fff1f2; color: #be123c; border: 1px solid #fecdd3; }
    .rama-badge-urgent { background-color: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .rama-badge-normal { background-color: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
  </style>

  <!-- ========================================== -->
  <!-- 3. ส่วน JavaScript (สมองกลระบบทำงานหลังโหลด UI เสร็จ) -->
  <!-- ========================================== -->
  <script>
    // อัปเดตลิงก์ API ใหม่จาก Google Apps Script
    const API_URL = "https://script.google.com/macros/s/AKfycbwh-PvW0UNXCz99CbzZJx9QJxhwL-M13P0fDn_55NTT_r942YryR6OuGhdmZiKlcVW_/exec";

    let state = {
      user: JSON.parse(localStorage.getItem('docuack_session')) || null,
      users: [], 
      docs: [],  
      tab: 'documents',
      search: '',
      filterUrgency: 'all',
      filterStatus: 'all',
      viewDoc: null,
      showCreateModal: false
    };

    async function initApp() {
      const loader = document.getElementById('global-loader');
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'getAppData' })
        });
        
        if (!response.ok) throw new Error("HTTP Status: " + response.status);
        
        const result = await response.json();
        
        if (result.status === 'success') {
          state.users = result.data.users;
          state.docs = result.data.docs;
        } else {
          throw new Error(result.message);
        }
      } catch (error) {
        console.error("API Error:", error);
        loader.innerHTML = `
          <div class="text-red-500 mb-4"><i class="fa-solid fa-triangle-exclamation text-5xl"></i></div>
          <h2 class="text-xl font-bold mb-2 text-red-500">เชื่อมต่อฐานข้อมูลล้มเหลว</h2>
          <p class="text-slate-300 text-sm mb-4">โปรดตรวจสอบการตั้งค่า API หรือรีเฟรชหน้าเว็บ</p>
          <button onclick="location.reload()" class="px-4 py-2 bg-blue-600 rounded-lg font-bold hover:bg-blue-700 transition">ลองใหม่อีกครั้ง</button>
        `;
        return; 
      } 
      
      loader.style.display = 'none';
      render();
    }

    function setSession(u) {
      if (u) localStorage.setItem('docuack_session', JSON.stringify(u));
      else localStorage.removeItem('docuack_session');
    }

    function isDocOverdue(doc) {
      if (!doc.endDate) return false;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const end = new Date(doc.endDate);
      end.setHours(23, 59, 59, 999);
      const targetCount = doc.targetAudience === 'All' ? state.users.length : (doc.targetAudience.split(',').length);
      return today.getTime() > end.getTime() && doc.readStatus.length < targetCount;
    }

    function render() {
      const app = document.getElementById('app');
      if (!state.user) {
        renderLogin(app);
      } else {
        renderDashboard(app);
      }
    }

    function renderLogin(app) {
      app.innerHTML = `
        <div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8">
          <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <div class="text-center mb-6">
              <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white shadow-xl mb-4">
                <i class="fa-solid fa-file-circle-check text-3xl"></i>
              </div>
              <h1 class="text-3xl font-extrabold text-white">DocuAck Portal</h1>
              <p class="text-sm text-slate-300 mt-1">ระบบรับทราบเอกสารองค์กร</p>
            </div>
            <div class="bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
              <h2 class="text-base font-bold text-slate-800 mb-4 text-center">เข้าสู่ระบบ</h2>
              <form id="loginForm" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-slate-600 uppercase mb-1">รหัสพนักงาน (Employee ID)</label>
                  <input type="text" id="loginId" required placeholder="กรอกรหัสพนักงาน" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold uppercase focus:outline-none focus:ring-2 focus:ring-blue-600" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-600 uppercase mb-1">รหัสผ่าน (PIN)</label>
                  <input type="password" id="loginPin" required placeholder="กรอกรหัสผ่าน" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-600" />
                </div>
                <div id="loginError" class="text-xs text-red-600 hidden font-medium text-center bg-red-50 p-2 rounded-lg border border-red-200"></div>
                <button type="submit" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold shadow-md transition-colors cursor-pointer">
                  เข้าสู่ระบบ
                </button>
              </form>
            </div>
          </div>
        </div>
      `;

      document.getElementById('loginForm').onsubmit = function(e) {
        e.preventDefault();
        const id = document.getElementById('loginId').value.trim().toUpperCase();
        const pin = document.getElementById('loginPin').value.trim();
        const err = document.getElementById('loginError');
        
        const u = state.users.find(x => String(x.id).toUpperCase() === id);
        
        if (!u) {
          err.innerText = "ไม่พบรหัสผู้ใช้ในระบบ";
          err.classList.remove('hidden');
          return;
        }
        if (pin !== String(u.pin)) {
          err.innerText = 'รหัสผ่าน PIN ไม่ถูกต้อง';
          err.classList.remove('hidden');
          return;
        }
        
        state.user = u;
        setSession(u);
        render();
      };
    }

    function renderDashboard(app) {
      const rawRole = state.user.role ? String(state.user.role) : '';
      const cleanRole = rawRole.trim().toLowerCase();
      const isAdmin = (cleanRole === 'admin' || cleanRole === 'ผู้ดูแลระบบ');
      
      const roleText = isAdmin ? 'Admin' : 'บุคลากรทั่วไป';
      const badgeClass = isAdmin ? 'bg-indigo-100 text-indigo-800' : 'bg-emerald-100 text-emerald-800';
      
      const adminHeroHtml = isAdmin ? `
        <div class="mb-8 p-6 rounded-2xl bg-gradient-to-r from-blue-700 via-indigo-600 to-indigo-800 text-white shadow-xl relative flex flex-col md:flex-row items-center justify-between gap-6">
          <div class="relative z-10 max-w-2xl">
            <h2 class="text-2xl font-black tracking-tight text-white mb-1.5">พื้นที่ผู้ดูแลระบบ (Admin)</h2>
            <p class="text-sm text-blue-100 leading-relaxed">ออกประกาศ นโยบาย แนบไฟล์เอกสาร และติดตามผลจากฐานข้อมูล Google Sheets</p>
          </div>
          <div class="relative z-10 shrink-0">
            <button onclick="openCreateDocModal()" class="px-6 py-3.5 bg-amber-400 hover:bg-amber-300 text-slate-900 font-extrabold text-sm rounded-xl shadow-lg transition-all flex items-center gap-2 cursor-pointer">
              <i class="fa-solid fa-cloud-arrow-up text-base"></i><span>อัปโหลดเอกสารใหม่</span>
            </button>
          </div>
        </div>
      ` : '';

      app.innerHTML = `
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-700 to-indigo-600 flex items-center justify-center text-white shadow-md">
                <i class="fa-solid fa-file-circle-check text-xl"></i>
              </div>
              <div>
                <div class="font-bold text-lg text-slate-900">DocuAck</div>
                <div class="text-xs text-slate-500">ระบบรับทราบเอกสารองค์กร</div>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <div class="text-right hidden sm:block">
                <div class="text-xs font-bold text-slate-900">${state.user.name}</div>
                <div class="text-[11px] text-slate-500">${state.user.id} • ${state.user.department}</div>
              </div>
              <span class="text-xs font-bold px-2 py-1 rounded-lg ${badgeClass}">${roleText}</span>
              <button onclick="logout()" class="px-3 py-1.5 text-xs text-red-600 hover:bg-red-50 rounded-lg font-bold transition-colors cursor-pointer">
                <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> ออกจากระบบ
              </button>
            </div>
          </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
          ${adminHeroHtml}
          <div class="flex items-center gap-2 border-b border-slate-200 mb-6 pb-2">
            <h2 class="text-xl font-bold text-slate-800"><i class="fa-regular fa-folder-open mr-2"></i> รายการเอกสารเวียนทั้งหมด</h2>
          </div>
          <div id="docs-tab-container"></div>
        </main>
      `;

      document.getElementById('docs-tab-container').innerHTML = renderDocsTab();
      if (state.viewDoc) renderViewerModal();
      if (state.showCreateModal) renderCreateDocModal();
    }

    function renderDocsTab() {
      const filtered = state.docs.filter(d => {
        const matchSearch = d.title.toLowerCase().includes(state.search.toLowerCase()) || d.id.toLowerCase().includes(state.search.toLowerCase());
        const matchUrgency = state.filterUrgency === 'all' || d.urgencyLevel === state.filterUrgency;
        
        let matchStatus = true;
        const isRead = d.readStatus.includes(state.user.id);
        const overdue = isDocOverdue(d);
        if (state.filterStatus === 'unread') matchStatus = !isRead;
        else if (state.filterStatus === 'read') matchStatus = isRead;
        else if (state.filterStatus === 'overdue') matchStatus = overdue;
        
        return matchSearch && matchUrgency && matchStatus;
      });

      let html = `
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 flex flex-col md:flex-row gap-3 items-center justify-between">
          <div class="w-full md:w-80 relative">
            <input type="text" placeholder="ค้นหาชื่อเอกสาร หรือรหัส..." value="${state.search}" oninput="setSearch(this.value)" class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
          </div>
          <div class="flex items-center gap-2 w-full md:w-auto">
            <select onchange="setFilterUrgency(this.value)" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-2 font-semibold">
              <option value="all" ${state.filterUrgency === 'all' ? 'selected' : ''}>ทุกระดับความเร่งด่วน</option>
              <option value="Very Urgent" ${state.filterUrgency === 'Very Urgent' ? 'selected' : ''}>🔴 ด่วนที่สุด</option>
              <option value="Urgent" ${state.filterUrgency === 'Urgent' ? 'selected' : ''}>🟠 ด่วนมาก</option>
              <option value="Normal" ${state.filterUrgency === 'Normal' ? 'selected' : ''}>🟢 ทั่วไป</option>
            </select>
            <select onchange="setFilterStatus(this.value)" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-2 font-semibold">
              <option value="all" ${state.filterStatus === 'all' ? 'selected' : ''}>ทุกสถานะ</option>
              <option value="unread" ${state.filterStatus === 'unread' ? 'selected' : ''}>ยังไม่อ่าน / รอรับทราบ</option>
              <option value="read" ${state.filterStatus === 'read' ? 'selected' : ''}>รับทราบแล้ว</option>
              <option value="overdue" ${state.filterStatus === 'overdue' ? 'selected' : ''}>เกินกำหนด</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      `;

      filtered.forEach(doc => {
        const isRead = doc.readStatus.includes(state.user.id);
        const overdue = isDocOverdue(doc);
        const urgencyClass = doc.urgencyLevel === 'Very Urgent' ? 'rama-badge-very-urgent' : doc.urgencyLevel === 'Urgent' ? 'rama-badge-urgent' : 'rama-badge-normal';
        const urgencyLabel = doc.urgencyLevel === 'Very Urgent' ? '🔴 ด่วนที่สุด' : doc.urgencyLevel === 'Urgent' ? '🟠 ด่วนมาก' : '🟢 ทั่วไป';
        const endDateLabel = doc.endDate || '-';
        const overdueHtml = (overdue && !isRead) ? '<span class="text-red-600 font-bold"><i class="fa-solid fa-triangle-exclamation mr-1"></i> เกินกำหนด!</span>' : '';
        
        let actionHtml = '';
        if (isRead) {
          actionHtml = `<span class="py-2 px-3 text-xs font-bold text-emerald-700 bg-emerald-50 rounded-xl border border-emerald-200 flex items-center gap-1"><i class="fa-solid fa-check"></i> รับทราบแล้ว</span>`;
        } else {
          actionHtml = `<button onclick="acknowledgeDoc('${doc.id}')" class="flex-1 py-2 px-3 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-sm transition-colors flex items-center justify-center gap-1 cursor-pointer"><i class="fa-solid fa-signature"></i> กดรับทราบ</button>`;
        }

        html += `
          <div class="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow p-5 flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between gap-2 mb-2.5">
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-full ${urgencyClass}">${urgencyLabel}</span>
                <span class="text-xs font-mono font-bold text-slate-400">${doc.id}</span>
              </div>
              <h3 class="text-sm font-bold text-slate-900 leading-snug line-clamp-2 mb-2">${doc.title}</h3>
            </div>
            <div class="pt-4 mt-2 border-t border-slate-100">
              <div class="flex items-center justify-between text-[11px] text-slate-500 mb-3">
                <span><i class="fa-regular fa-calendar mr-1"></i> สิ้นสุด: ${endDateLabel}</span>
                ${overdueHtml}
              </div>
              <div class="flex items-center justify-between gap-2">
                <button onclick="openViewer('${doc.id}')" class="flex-1 py-2 px-3 text-xs font-bold rounded-xl border border-slate-300 hover:bg-slate-50 transition-colors flex items-center justify-center gap-1.5 cursor-pointer">
                  <i class="fa-regular fa-eye"></i> เปิดอ่าน
                </button>
                ${actionHtml}
              </div>
            </div>
          </div>
        `;
      });

      html += `</div>`;
      if (filtered.length === 0) {
        html += '<div class="text-center py-12 text-slate-400 text-sm">ไม่พบเอกสารตามเงื่อนไขที่เลือก</div>';
      }
      return html;
    }

    function renderViewerModal() {
      const doc = state.viewDoc;
      const isRead = doc.readStatus.includes(state.user.id);
      
      let actionHtml = '';
      if (!isRead) {
        actionHtml = `<button onclick="acknowledgeDoc('${doc.id}'); closeViewer();" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold shadow-md cursor-pointer transition-colors"><i class="fa-solid fa-check-double mr-1"></i> ข้าพเจ้าได้อ่านและรับทราบแล้ว</button>`;
      } else {
        actionHtml = `<span class="text-sm font-bold text-emerald-700 bg-emerald-50 px-4 py-2 rounded-xl border border-emerald-200"><i class="fa-solid fa-check-circle mr-1"></i> รับทราบเรียบร้อยแล้ว</span>`;
      }

      document.getElementById('modal-container').innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/70 backdrop-blur-sm p-4">
          <div class="bg-white rounded-2xl w-full max-w-4xl h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
              <div>
                <span class="text-xs font-mono font-bold text-slate-400">${doc.id}</span>
                <h3 class="text-base font-bold text-slate-900">${doc.title}</h3>
              </div>
              <button onclick="closeViewer()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 rounded-lg px-3 py-1 text-sm font-bold cursor-pointer transition-colors">ปิด ✕</button>
            </div>
            <div class="flex-1 bg-slate-200 p-2 relative">
              <iframe src="${doc.fileUrl}" class="w-full h-full rounded-xl border border-slate-300 bg-white" frameborder="0"></iframe>
            </div>
            <div class="p-4 border-t border-slate-200 flex items-center justify-between bg-white">
              <a href="${doc.fileUrl}" target="_blank" class="text-xs font-bold text-blue-600 hover:underline">
                <i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> ดูในแท็บใหม่
              </a>
              ${actionHtml}
            </div>
          </div>
        </div>
      `;
    }

    function renderCreateDocModal() {
      const todayString = new Date().toISOString().split('T')[0];
      document.getElementById('modal-container').innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/70 backdrop-blur-sm p-4">
          <div class="bg-white rounded-2xl w-full max-w-lg p-6 shadow-2xl">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
              <h3 class="text-lg font-bold text-slate-900"><i class="fa-solid fa-cloud-arrow-up mr-2 text-blue-600"></i>อัปโหลดเอกสารเวียน</h3>
              <button onclick="closeCreateDocModal()" class="text-slate-400 hover:text-slate-600 cursor-pointer text-xl">✕</button>
            </div>
            <form id="createDocForm" class="space-y-4 text-sm">
              <div>
                <label class="block font-bold text-slate-700 mb-1">ชื่อเรื่อง / ประกาศ <span class="text-red-500">*</span></label>
                <input type="text" id="newTitle" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" />
              </div>
              <div class="p-3 bg-blue-50 border border-blue-100 rounded-xl">
                <label class="block font-bold text-blue-900 mb-1">แนบไฟล์ (PDF หรือ รูปภาพ) <span class="text-red-500">*</span></label>
                <input type="file" id="newFile" accept="image/*,application/pdf" required class="w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block font-bold text-slate-700 mb-1">ระดับความเร่งด่วน</label>
                  <select id="newUrgency" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 font-semibold">
                    <option value="Very Urgent">🔴 ด่วนที่สุด</option>
                    <option value="Urgent">🟠 ด่วนมาก</option>
                    <option value="Normal" selected>🟢 ทั่วไป</option>
                  </select>
                </div>
                <div>
                  <label class="block font-bold text-slate-700 mb-1">หมวดหมู่</label>
                  <input type="text" id="newCategory" value="ประกาศทั่วไป" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block font-bold text-slate-700 mb-1">วันที่ประกาศ</label>
                  <input type="date" id="newStartDate" value="${todayString}" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div>
                  <label class="block font-bold text-slate-700 mb-1">เส้นตาย (Deadline)</label>
                  <input type="date" id="newEndDate" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
              </div>
              <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
                <button type="button" onclick="closeCreateDocModal()" class="px-5 py-2.5 font-bold text-slate-600 hover:bg-slate-100 rounded-xl cursor-pointer transition-colors">ยกเลิก</button>
                <button type="submit" id="btnSubmitDoc" class="px-6 py-2.5 font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-md cursor-pointer transition-colors">เริ่มอัปโหลดเข้าเซิร์ฟเวอร์</button>
              </div>
            </form>
          </div>
        </div>
      `;

      document.getElementById('createDocForm').onsubmit = function(e) {
        e.preventDefault();
        const fileInput = document.getElementById('newFile');
        if (fileInput.files.length === 0) return alert('กรุณาเลือกไฟล์เอกสาร');

        const file = fileInput.files[0];
        const reader = new FileReader();
        const submitBtn = document.getElementById('btnSubmitDoc');
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> กำลังอัปโหลด...';
        submitBtn.disabled = true;

        reader.onload = async function(event) {
          const payload = {
            action: 'addDocument',
            data: {
              title: document.getElementById('newTitle').value.trim(),
              fileBase64: event.target.result,
              fileName: file.name,
              urgencyLevel: document.getElementById('newUrgency').value,
              category: document.getElementById('newCategory').value.trim(),
              startDate: document.getElementById('newStartDate').value,
              endDate: document.getElementById('newEndDate').value,
              targetAudience: 'All'
            }
          };

          try {
            const res = await fetch(API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(payload)
            });
            const result = await res.json();
            if (result.status === 'success') {
              alert("อัปโหลดเอกสารสำเร็จ!");
              state.showCreateModal = false;
              document.getElementById('global-loader').style.display = 'flex';
              await initApp(); 
            } else {
              alert("เกิดข้อผิดพลาด: " + result.message);
            }
          } catch (err) {
            alert("เชื่อมต่อ API ไม่สำเร็จ");
          } finally {
            if (document.getElementById('btnSubmitDoc')) {
              submitBtn.innerText = "เริ่มอัปโหลดเข้าเซิร์ฟเวอร์";
              submitBtn.disabled = false;
            }
          }
        };
        reader.readAsDataURL(file);
      };
    }

    // --- Action Handlers ---
    window.logout = function() { state.user = null; setSession(null); render(); };
    window.setTab = function(t) { state.tab = t; render(); };
    window.setSearch = function(s) { state.search = s; render(); };
    window.setFilterUrgency = function(u) { state.filterUrgency = u; render(); };
    window.setFilterStatus = function(st) { state.filterStatus = st; render(); };
    
    window.openViewer = function(docId) { 
      state.viewDoc = state.docs.find(d => d.id === docId); 
      renderViewerModal(); 
    };
    
    window.closeViewer = function() { 
      state.viewDoc = null; 
      document.getElementById('modal-container').innerHTML = ''; 
    };

    window.openCreateDocModal = function() {
      state.showCreateModal = true;
      renderCreateDocModal();
    };

    window.closeCreateDocModal = function() {
      state.showCreateModal = false;
      document.getElementById('modal-container').innerHTML = '';
    };

    window.acknowledgeDoc = async function(docId) {
      const doc = state.docs.find(d => d.id === docId);
      if (!doc || doc.readStatus.includes(state.user.id)) return;
      doc.readStatus.push(state.user.id);
      render();

      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'acknowledge', docId: docId, userId: state.user.id })
        });
      } catch (err) {
        console.error("Connection Error: ", err);
      }
    };

    // --- เริ่มทำงานระบบเมื่อเปิดหน้าเว็บ ---
    window.onload = initApp;
  </script>
</body>
</html>
