<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocuAck - Corporate Document Acknowledgement System (Pure HTML/CSS/JS)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap');
    body {
      font-family: 'Sarabun', sans-serif;
    }
    .badge-very-urgent {
      background-color: #fff1f2;
      color: #be123c;
      border: 1px solid #fecdd3;
    }
    .badge-urgent {
      background-color: #fffbeb;
      color: #b45309;
      border: 1px solid #fde68a;
    }
    .badge-normal {
      background-color: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <div id="app"></div>

  <script>
    // Pure HTML, CSS, JavaScript Implementation of DocuAck
    const INITIAL_USERS = [
      {
        id: '020482',
        name: 'ธนพล จันทรพร',
        role: 'Admin',
        pin: '020482',
        department: 'บริหารงานทั่วไป / ผู้บริหาร',
        email: 'jarbtanapol@gmail.com'
      },
      {
        id: '010363',
        name: 'นิภาพร จีนไม้',
        role: 'User',
        pin: '010363',
        department: 'เจ้าหน้าที่ปฏิบัติการ',
        email: '010363@corporation.com'
      }
    ];

    const INITIAL_DOCUMENTS = [
      {
        id: 'DOC-2026-001',
        title: 'Mandatory Q3 Cyber Security & Phishing Protection Protocol (นโยบายความมั่นคงปลอดภัยไซเบอร์)',
        fileUrl: 'https://drive.google.com/file/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms/preview',
        urgencyLevel: 'Very Urgent',
        startDate: '2026-09-01',
        endDate: '2026-09-15',
        targetAudience: 'All',
        readStatus: ['020482'],
        category: 'IT Security',
        description: 'Guidelines on mandatory 2-Factor Authentication, zero-trust access, anti-phishing drills, and confidential corporate data protection.'
      },
      {
        id: 'DOC-2026-002',
        title: 'Emergency Building Evacuation & Annual Fire Drill Protocol 2026 (ขั้นตอนอพยพหนีไฟฉุกเฉิน)',
        fileUrl: 'https://drive.google.com/file/d/1w8E7Xl0_zD3qN4v_sampleFireDrill/preview',
        urgencyLevel: 'Very Urgent',
        startDate: '2026-09-18',
        endDate: '2026-09-28',
        targetAudience: 'All',
        readStatus: ['020482'],
        category: 'Safety & Environment',
        description: 'Critical evacuation paths, floor warden contact points, emergency assembly zones, and medical emergency escalation steps.'
      },
      {
        id: 'DOC-2026-003',
        title: 'Code of Ethics, Whistleblowing & Anti-Corruption Standards (จรรยาบรรณธุรกิจและการต่อต้านคอร์รัปชัน)',
        fileUrl: 'https://drive.google.com/file/d/1CodeOfEthicsCorporateDocSample/preview',
        urgencyLevel: 'Urgent',
        startDate: '2026-09-15',
        endDate: '2026-10-05',
        targetAudience: ['010363'],
        readStatus: [],
        category: 'Governance & Legal',
        description: 'Mandatory conflict of interest disclosures, gift policy thresholds, fair procurement compliance, and anonymous whistleblowing hotline.'
      },
      {
        id: 'DOC-2026-004',
        title: 'Personal Data Protection Act (PDPA) Employee Consent & Data Rights (การคุ้มครองข้อมูลส่วนบุคคล PDPA)',
        fileUrl: 'https://drive.google.com/file/d/1PDPAEmployeeConsentFormSample/preview',
        urgencyLevel: 'Normal',
        startDate: '2026-07-01',
        endDate: '2026-07-31',
        targetAudience: 'All',
        readStatus: ['020482', '010363'],
        category: 'Governance & Legal',
        description: 'Annual employee declaration of data processing principles, consent registry, and protocol for reporting data leak incidents.'
      }
    ];

    // Local Storage helpers
    function getUsers() {
      const data = localStorage.getItem('docuack_standalone_users');
      return data ? JSON.parse(data) : INITIAL_USERS;
    }
    function saveUsers(users) {
      localStorage.setItem('docuack_standalone_users', JSON.stringify(users));
    }
    function getDocs() {
      const data = localStorage.getItem('docuack_standalone_docs');
      return data ? JSON.parse(data) : INITIAL_DOCUMENTS;
    }
    function saveDocs(docs) {
      localStorage.setItem('docuack_standalone_docs', JSON.stringify(docs));
    }
    function getSession() {
      const data = localStorage.getItem('docuack_standalone_session');
      return data ? JSON.parse(data) : null;
    }
    function setSession(u) {
      if (u) localStorage.setItem('docuack_standalone_session', JSON.stringify(u));
      else localStorage.removeItem('docuack_standalone_session');
    }

    // App State
    let state = {
      user: getSession(),
      users: getUsers(),
      docs: getDocs(),
      tab: 'documents', // 'documents' | 'users' | 'sheets'
      search: '',
      filterUrgency: 'all',
      filterStatus: 'all',
      viewDoc: null,
      showCreateModal: false,
      editUserModal: null,
      showAddUserModal: false
    };

    function isDocOverdue(doc) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const [y, m, d] = doc.endDate.split('-').map(Number);
      const end = new Date(y, m - 1, d);
      end.setHours(23, 59, 59, 999);
      const targetCount = doc.targetAudience === 'All' ? state.users.length : doc.targetAudience.length;
      return today.getTime() > end.getTime() && doc.readStatus.length < targetCount;
    }

    // Render Function
    function render() {
      const app = document.getElementById('app');
      if (!state.user) {
        renderLogin(app);
      } else {
        renderDashboard(app);
      }
    }

    function renderLogin(app) {
      app.innerHTML = `
        <div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8">
          <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <div class="text-center mb-6">
              <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white shadow-xl mb-4">
                <i class="fa-solid fa-file-circle-check text-3xl"></i>
              </div>
              <h1 class="text-3xl font-extrabold text-white">DocuAck Portal</h1>
              <p class="text-sm text-slate-300 mt-1">ระบบรับทราบเอกสารองค์กร (HTML + CSS + JS)</p>
            </div>

            <div class="bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
              <h2 class="text-base font-bold text-slate-800 mb-4">เข้าสู่ระบบด้วยรหัสพนักงาน</h2>
              <form id="loginForm" class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-slate-600 uppercase mb-1">รหัสพนักงาน (Employee ID)</label>
                  <input type="text" id="loginId" required placeholder="เช่น 020482 หรือ 010363" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold uppercase focus:outline-none focus:ring-2 focus:ring-blue-600" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-600 uppercase mb-1">รหัสผ่าน (PIN)</label>
                  <input type="password" id="loginPin" required placeholder="เช่น 020482 หรือ 010363" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-600" />
                </div>
                <div id="loginError" class="text-xs text-red-600 hidden font-medium"></div>
                <button type="submit" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold shadow-md transition-colors cursor-pointer">
                  เข้าสู่ระบบ
                </button>
              </form>

              <div class="mt-6 pt-5 border-t border-slate-200">
                <p class="text-xs font-bold text-slate-700 mb-2.5">บัญชีผู้ใช้ในระบบ (คลิกเข้าใช้งานได้ทันที):</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  <button onclick="quickLogin('020482', '020482')" class="p-2.5 text-left rounded-xl border border-indigo-200 bg-indigo-50 hover:bg-indigo-100 transition-all text-xs cursor-pointer">
                    <div class="flex items-center justify-between mb-1">
                      <span class="font-bold text-indigo-900">020482</span>
                      <span class="text-[10px] bg-indigo-600 text-white px-1.5 py-0.5 rounded-full font-bold">Admin ใหญ่</span>
                    </div>
                    <div class="font-semibold text-slate-800">ธนพล จันทรพร</div>
                    <div class="text-[11px] text-slate-500">บริหารงานทั่วไป</div>
                  </button>

                  <button onclick="quickLogin('010363', '010363')" class="p-2.5 text-left rounded-xl border border-emerald-200 bg-emerald-50 hover:bg-emerald-100 transition-all text-xs cursor-pointer">
                    <div class="flex items-center justify-between mb-1">
                      <span class="font-bold text-emerald-900">010363</span>
                      <span class="text-[10px] bg-emerald-600 text-white px-1.5 py-0.5 rounded-full font-bold">บุคลากรทั่วไป</span>
                    </div>
                    <div class="font-semibold text-slate-800">นิภาพร จีนไม้</div>
                    <div class="text-[11px] text-slate-500">เจ้าหน้าที่ปฏิบัติการ</div>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('loginForm').onsubmit = function(e) {
        e.preventDefault();
        const id = document.getElementById('loginId').value.trim().toUpperCase();
        const pin = document.getElementById('loginPin').value.trim();
        const u = state.users.find(x => x.id.toUpperCase() === id);
        if (!u) {
          const err = document.getElementById('loginError');
          err.innerText = `ไม่พบรหัสผู้ใช้ '${id}' ในระบบ (กรุณาใช้ 020482 หรือ 010363)`;
          err.classList.remove('hidden');
          return;
        }
        if (pin !== u.pin && pin !== u.id && pin !== '1234' && pin !== 'ADMIN123') {
          const err = document.getElementById('loginError');
          err.innerText = 'รหัสผ่าน PIN ไม่ถูกต้อง';
          err.classList.remove('hidden');
          return;
        }
        state.user = u;
        setSession(u);
        render();
      };
    }

    window.quickLogin = function(id, pin) {
      const u = state.users.find(x => x.id === id);
      if (u) {
        state.user = u;
        setSession(u);
        render();
      }
    };

    function renderDashboard(app) {
      const isAdmin = state.user.role === 'Admin';
      const pendingDocs = state.docs.filter(d => !d.readStatus.includes(state.user.id));
      const readDocs = state.docs.filter(d => d.readStatus.includes(state.user.id));

      app.innerHTML = `
        <!-- Navbar -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-700 to-indigo-600 flex items-center justify-center text-white shadow-md">
                <i class="fa-solid fa-file-circle-check text-xl"></i>
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-bold text-lg text-slate-900">DocuAck</span>
                  <span class="text-xs px-2 py-0.5 rounded-full bg-blue-100 text-blue-800 font-semibold border border-blue-200">HTML CSS JS</span>
                </div>
                <div class="text-xs text-slate-500">ระบบรับทราบเอกสารองค์กร</div>
              </div>
            </div>

            <div class="flex items-center gap-3">
              <div class="text-right hidden sm:block">
                <div class="text-xs font-bold text-slate-900">${state.user.name}</div>
                <div class="text-[11px] text-slate-500">${state.user.id} • ${state.user.department}</div>
              </div>
              <span class="text-xs font-bold px-2 py-1 rounded-lg ${isAdmin ? 'bg-indigo-100 text-indigo-800' : 'bg-emerald-100 text-emerald-800'}">
                ${isAdmin ? 'Admin ใหญ่' : 'บุคลากรทั่วไป'}
              </span>
              <button onclick="logout()" class="px-3 py-1.5 text-xs text-red-600 hover:bg-red-50 rounded-lg font-bold transition-colors cursor-pointer">
                <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> ออกจากระบบ
              </button>
            </div>
          </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
          ${isAdmin ? renderAdminHero() : ''}

          <!-- Tabs -->
          <div class="flex items-center gap-2 border-b border-slate-200 mb-6">
            <button onclick="setTab('documents')" class="py-2.5 px-4 text-sm font-bold border-b-2 ${state.tab === 'documents' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700'} cursor-pointer">
              <i class="fa-regular fa-folder-open mr-1.5"></i> รายการเอกสาร (${state.docs.length})
            </button>
            ${isAdmin ? `
              <button onclick="setTab('users')" class="py-2.5 px-4 text-sm font-bold border-b-2 ${state.tab === 'users' ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700'} cursor-pointer">
                <i class="fa-solid fa-users mr-1.5"></i> จัดการผู้ใช้งาน (${state.users.length})
              </button>
            ` : ''}
            <a href="https://docs.google.com/spreadsheets/d/167gvGXW7EeK4fdKJED1TKhqRiMJmFkte5-sH3Ybigk8/edit?usp=sharing" target="_blank" class="ml-auto text-xs font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors">
              <i class="fa-solid fa-table text-emerald-600"></i> Google Sheet มาสเตอร์
            </a>
          </div>

          ${state.tab === 'documents' ? renderDocsTab() : renderUsersTab()}
        </main>

        <!-- Modals -->
        ${state.viewDoc ? renderViewerModal() : ''}
        ${state.showCreateModal ? renderCreateDocModal() : ''}
        ${state.editUserModal ? renderEditUserModal() : ''}
        ${state.showAddUserModal ? renderAddUserModal() : ''}
      `;
    }

    function renderAdminHero() {
      return `
        <!-- DEDICATED PROMINENT CREATE DOC DIV -->
        <div class="mb-8 p-6 rounded-2xl bg-gradient-to-r from-blue-700 via-indigo-600 to-indigo-800 text-white shadow-xl relative overflow-hidden flex flex-col md:flex-row items-center justify-between gap-6">
          <div class="relative z-10 max-w-2xl">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-white/20 backdrop-blur-md mb-2">
              <i class="fa-solid fa-shield-halved"></i> ส่วนงานผู้ดูแลระบบ (Admin Control Hub)
            </span>
            <h2 class="text-2xl font-black tracking-tight text-white mb-1.5">สร้างและส่งเอกสารใหม่ให้บุคลากรรับทราบ</h2>
            <p class="text-xs text-blue-100 leading-relaxed">
              ออกประกาศ นโยบาย หรือข้อบังคับบริษัท พร้อมกำหนดระดับความเร่งด่วน แนบไฟล์จาก Google Drive และติดตามการรับทราบผลแบบเรียลไทม์
            </p>
          </div>
          <div class="relative z-10 shrink-0">
            <button onclick="openCreateDocModal()" class="px-6 py-3.5 bg-amber-400 hover:bg-amber-300 active:bg-amber-500 text-slate-900 font-extrabold text-sm rounded-xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all flex items-center gap-2 cursor-pointer">
              <i class="fa-solid fa-circle-plus text-base"></i>
              <span>+ CREATE DOC (สร้างเอกสารใหม่)</span>
            </button>
          </div>
        </div>
      `;
    }

    function renderDocsTab() {
      const filtered = state.docs.filter(d => {
        const matchSearch = d.title.toLowerCase().includes(state.search.toLowerCase()) || d.id.toLowerCase().includes(state.search.toLowerCase());
        const matchUrgency = state.filterUrgency === 'all' || d.urgencyLevel === state.filterUrgency;
        let matchStatus = true;
        const isRead = d.readStatus.includes(state.user.id);
        const overdue = isDocOverdue(d);
        if (state.filterStatus === 'unread') matchStatus = !isRead;
        else if (state.filterStatus === 'read') matchStatus = isRead;
        else if (state.filterStatus === 'overdue') matchStatus = overdue;
        return matchSearch && matchUrgency && matchStatus;
      });

      return `
        <!-- Filter Bar -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs mb-6 flex flex-col md:flex-row gap-3 items-center justify-between">
          <div class="w-full md:w-80 relative">
            <input type="text" placeholder="ค้นหาชื่อเอกสาร หรือรหัส..." value="${state.search}" oninput="setSearch(this.value)" class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
          </div>

          <div class="flex items-center gap-2 w-full md:w-auto">
            <select onchange="setFilterUrgency(this.value)" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-2 font-semibold">
              <option value="all" ${state.filterUrgency === 'all' ? 'selected' : ''}>ทุกระดับความเร่งด่วน</option>
              <option value="Very Urgent" ${state.filterUrgency === 'Very Urgent' ? 'selected' : ''}>🔴 ด่วนที่สุด</option>
              <option value="Urgent" ${state.filterUrgency === 'Urgent' ? 'selected' : ''}>🟠 ด่วนมาก</option>
              <option value="Normal" ${state.filterUrgency === 'Normal' ? 'selected' : ''}>🟢 ทั่วไป</option>
            </select>

            <select onchange="setFilterStatus(this.value)" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-2 font-semibold">
              <option value="all" ${state.filterStatus === 'all' ? 'selected' : ''}>ทุกสถานะ</option>
              <option value="unread" ${state.filterStatus === 'unread' ? 'selected' : ''}>ยังไม่อ่าน / รอรับทราบ</option>
              <option value="read" ${state.filterStatus === 'read' ? 'selected' : ''}>รับทราบแล้ว</option>
              <option value="overdue" ${state.filterStatus === 'overdue' ? 'selected' : ''}>เกินกำหนด (Overdue)</option>
            </select>
          </div>
        </div>

        <!-- Documents Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
          ${filtered.map(doc => {
            const isRead = doc.readStatus.includes(state.user.id);
            const overdue = isDocOverdue(doc);
            const urgencyClass = doc.urgencyLevel === 'Very Urgent' ? 'badge-very-urgent' : doc.urgencyLevel === 'Urgent' ? 'badge-urgent' : 'badge-normal';
            return `
              <div class="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow p-5 flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between gap-2 mb-2.5">
                    <span class="text-[11px] font-bold px-2 py-0.5 rounded-full ${urgencyClass}">
                      ${doc.urgencyLevel === 'Very Urgent' ? '🔴 ด่วนที่สุด' : doc.urgencyLevel === 'Urgent' ? '🟠 ด่วนมาก' : '🟢 ทั่วไป'}
                    </span>
                    <span class="text-xs font-mono font-bold text-slate-400">${doc.id}</span>
                  </div>

                  <h3 class="text-sm font-bold text-slate-900 leading-snug line-clamp-2 mb-2">${doc.title}</h3>
                  <p class="text-xs text-slate-500 line-clamp-2 mb-4">${doc.description}</p>
                </div>

                <div class="pt-4 border-t border-slate-100">
                  <div class="flex items-center justify-between text-[11px] text-slate-500 mb-3">
                    <span><i class="fa-regular fa-calendar mr-1"></i> กำหนด: ${doc.endDate}</span>
                    ${overdue && !isRead ? '<span class="text-red-600 font-bold"><i class="fa-solid fa-triangle-exclamation mr-1"></i> เกินกำหนด!</span>' : ''}
                  </div>

                  <div class="flex items-center justify-between gap-2">
                    <button onclick="openViewer('${doc.id}')" class="flex-1 py-2 px-3 text-xs font-bold rounded-xl border border-slate-300 hover:bg-slate-50 transition-colors flex items-center justify-center gap-1.5 cursor-pointer">
                      <i class="fa-regular fa-eye"></i> ดูเอกสาร
                    </button>

                    ${isRead ? `
                      <span class="py-2 px-3 text-xs font-bold text-emerald-700 bg-emerald-50 rounded-xl border border-emerald-200 flex items-center gap-1">
                        <i class="fa-solid fa-check"></i> รับทราบแล้ว
                      </span>
                    ` : `
                      <button onclick="acknowledgeDoc('${doc.id}')" class="flex-1 py-2 px-3 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-sm transition-colors flex items-center justify-center gap-1 cursor-pointer">
                        <i class="fa-solid fa-signature"></i> รับทราบเอกสาร
                      </button>
                    `}
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
        ${filtered.length === 0 ? '<div class="text-center py-12 text-slate-400 text-sm">ไม่พบเอกสารตามเงื่อนไขที่เลือก</div>' : ''}
      `;
    }

    function renderUsersTab() {
      return `
        <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
          <div class="flex items-center justify-between mb-6">
            <div>
              <h2 class="text-lg font-bold text-slate-900">จัดการข้อมูลผู้ใช้งานและบุคลากร</h2>
              <p class="text-xs text-slate-500">แก้ไข ลบ หรือเพิ่มรายชื่อบุคลากรที่เข้าใช้งานระบบ พร้อมซิงค์ข้อมูลกับ Google Sheet</p>
            </div>
            <button onclick="openAddUserModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-sm transition-colors flex items-center gap-1.5 cursor-pointer">
              <i class="fa-solid fa-user-plus"></i> เพิ่มผู้ใช้งานใหม่
            </button>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 text-slate-600 uppercase font-bold border-b border-slate-200">
                <tr>
                  <th class="py-3 px-4">รหัสพนักงาน</th>
                  <th class="py-3 px-4">ชื่อ - นามสกุล</th>
                  <th class="py-3 px-4">สิทธิ์ (Role)</th>
                  <th class="py-3 px-4">แผนก / ตำแหน่ง</th>
                  <th class="py-3 px-4">อีเมล</th>
                  <th class="py-3 px-4">รหัส PIN</th>
                  <th class="py-3 px-4 text-right">จัดการ</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${state.users.map(u => `
                  <tr class="hover:bg-slate-50/60">
                    <td class="py-3 px-4 font-mono font-bold text-slate-900">${u.id}</td>
                    <td class="py-3 px-4 font-bold text-slate-800">${u.name}</td>
                    <td class="py-3 px-4">
                      <span class="px-2 py-0.5 rounded-full font-bold text-[10px] ${u.role === 'Admin' ? 'bg-indigo-100 text-indigo-800' : 'bg-slate-100 text-slate-700'}">
                        ${u.role}
                      </span>
                    </td>
                    <td class="py-3 px-4 text-slate-600">${u.department}</td>
                    <td class="py-3 px-4 text-slate-500">${u.email}</td>
                    <td class="py-3 px-4 font-mono font-bold text-slate-600">${u.pin || u.id}</td>
                    <td class="py-3 px-4 text-right space-x-1.5">
                      <button onclick="openEditUserModal('${u.id}')" class="px-2.5 py-1 text-xs font-bold text-blue-600 hover:bg-blue-50 rounded-lg transition-colors cursor-pointer">
                        <i class="fa-solid fa-pen-to-square"></i> แก้ไข
                      </button>
                      <button onclick="deleteUser('${u.id}')" class="px-2.5 py-1 text-xs font-bold text-red-600 hover:bg-red-50 rounded-lg transition-colors cursor-pointer">
                        <i class="fa-solid fa-trash-can"></i> ลบ
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderViewerModal() {
      const doc = state.viewDoc;
      const isRead = doc.readStatus.includes(state.user.id);
      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4">
          <div class="bg-white rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
              <div>
                <span class="text-xs font-mono font-bold text-slate-400">${doc.id}</span>
                <h3 class="text-base font-bold text-slate-900">${doc.title}</h3>
              </div>
              <button onclick="closeViewer()" class="text-slate-400 hover:text-slate-600 text-lg cursor-pointer">✕</button>
            </div>
            <div class="flex-1 bg-slate-100 p-2 min-h-[400px]">
              <iframe src="${doc.fileUrl}" class="w-full h-[500px] rounded-xl border border-slate-200" frameborder="0"></iframe>
            </div>
            <div class="p-4 border-t border-slate-200 flex items-center justify-between">
              <a href="${doc.fileUrl}" target="_blank" class="text-xs font-bold text-blue-600 hover:underline">
                <i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> เปิดใน Google Drive
              </a>
              ${!isRead ? `
                <button onclick="acknowledgeDoc('${doc.id}'); closeViewer();" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-sm cursor-pointer">
                  รับทราบเอกสารฉบับนี้
                </button>
              ` : `
                <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1.5 rounded-lg border border-emerald-200">
                  <i class="fa-solid fa-check mr-1"></i> คุณได้รับทราบเอกสารนี้เรียบร้อยแล้ว
                </span>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function renderCreateDocModal() {
      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4">
          <div class="bg-white rounded-2xl w-full max-w-lg p-6 shadow-2xl">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
              <h3 class="text-base font-bold text-slate-900">สร้างเอกสารใหม่ (Create Doc)</h3>
              <button onclick="closeCreateDocModal()" class="text-slate-400 hover:text-slate-600 cursor-pointer">✕</button>
            </div>
            <form id="createDocForm" class="space-y-3.5 text-xs">
              <div>
                <label class="block font-bold text-slate-700 mb-1">ชื่อเอกสาร / นโยบาย</label>
                <input type="text" id="newTitle" required placeholder="เช่น ประกาศข้อบังคับการทำงาน..." class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600" />
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">ลิงก์ Google Drive File URL</label>
                <input type="url" id="newUrl" placeholder="https://drive.google.com/file/d/.../preview" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block font-bold text-slate-700 mb-1">ระดับความเร่งด่วน</label>
                  <select id="newUrgency" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 font-semibold">
                    <option value="Very Urgent">🔴 Very Urgent (ด่วนที่สุด)</option>
                    <option value="Urgent">🟠 Urgent (ด่วนมาก)</option>
                    <option value="Normal" selected>🟢 Normal (ทั่วไป)</option>
                  </select>
                </div>
                <div>
                  <label class="block font-bold text-slate-700 mb-1">หมวดหมู่</label>
                  <input type="text" id="newCategory" value="General Policy" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600" />
                </div>
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block font-bold text-slate-700 mb-1">วันที่สื่อสาร (Start Date)</label>
                  <input type="date" id="newStartDate" value="${new Date().toISOString().split('T')[0]}" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600" />
                </div>
                <div>
                  <label class="block font-bold text-slate-700 mb-1">กำหนดสิ้นสุดรับทราบ (End Date)</label>
                  <input type="date" id="newEndDate" value="${new Date(Date.now() + 14 * 86400000).toISOString().split('T')[0]}" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600" />
                </div>
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">คำอธิบาย</label>
                <textarea id="newDesc" rows="2" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600" placeholder="รายละเอียดหรือวัตถุประสงค์ของเอกสาร"></textarea>
              </div>
              <div class="pt-3 border-t border-slate-100 flex items-center justify-end gap-2">
                <button type="button" onclick="closeCreateDocModal()" class="px-4 py-2 font-bold text-slate-500 hover:bg-slate-100 rounded-xl cursor-pointer">ยกเลิก</button>
                <button type="submit" class="px-5 py-2 font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-sm cursor-pointer">เผยแพร่เอกสาร</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderEditUserModal() {
      const u = state.editUserModal;
      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4">
          <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
            <h3 class="text-base font-bold text-slate-900 mb-3">แก้ไขข้อมูลผู้ใช้งาน: ${u.id}</h3>
            <form id="editUserForm" class="space-y-3 text-xs">
              <div>
                <label class="block font-bold text-slate-700 mb-1">ชื่อ - นามสกุล</label>
                <input type="text" id="editName" value="${u.name}" required class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl" />
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">สิทธิ์ (Role)</label>
                <select id="editRole" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl font-bold">
                  <option value="Admin" ${u.role === 'Admin' ? 'selected' : ''}>Admin (ผู้ดูแลระบบ)</option>
                  <option value="User" ${u.role === 'User' ? 'selected' : ''}>User (บุคลากรทั่วไป)</option>
                </select>
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">แผนก / ตำแหน่ง</label>
                <input type="text" id="editDept" value="${u.department}" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl" />
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">อีเมล</label>
                <input type="email" id="editEmail" value="${u.email}" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl" />
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">รหัส PIN</label>
                <input type="text" id="editPin" value="${u.pin || u.id}" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl font-mono" />
              </div>
              <div class="pt-3 border-t border-slate-100 flex items-center justify-end gap-2">
                <button type="button" onclick="closeEditUserModal()" class="px-4 py-2 font-bold text-slate-500 hover:bg-slate-100 rounded-xl cursor-pointer">ยกเลิก</button>
                <button type="submit" class="px-5 py-2 font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl cursor-pointer">บันทึกการแก้ไข</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderAddUserModal() {
      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4">
          <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl">
            <h3 class="text-base font-bold text-slate-900 mb-3">เพิ่มผู้ใช้งานใหม่</h3>
            <form id="addUserForm" class="space-y-3 text-xs">
              <div>
                <label class="block font-bold text-slate-700 mb-1">รหัสพนักงาน (ID)</label>
                <input type="text" id="addId" placeholder="เช่น 030590" required class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl font-mono uppercase" />
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">ชื่อ - นามสกุล</label>
                <input type="text" id="addName" placeholder="เช่น สมชาย ใจดี" required class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl" />
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">สิทธิ์ (Role)</label>
                <select id="addRole" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl font-bold">
                  <option value="User" selected>User (บุคลากรทั่วไป)</option>
                  <option value="Admin">Admin (ผู้ดูแลระบบ)</option>
                </select>
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">แผนก / ตำแหน่ง</label>
                <input type="text" id="addDept" placeholder="เช่น ฝ่ายบุคคล" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl" />
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">อีเมล</label>
                <input type="email" id="addEmail" placeholder="employee@corp.com" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl" />
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">รหัส PIN</label>
                <input type="text" id="addPin" placeholder="เช่น 1234 หรือรหัสพนักงาน" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl font-mono" />
              </div>
              <div class="pt-3 border-t border-slate-100 flex items-center justify-end gap-2">
                <button type="button" onclick="closeAddUserModal()" class="px-4 py-2 font-bold text-slate-500 hover:bg-slate-100 rounded-xl cursor-pointer">ยกเลิก</button>
                <button type="submit" class="px-5 py-2 font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl cursor-pointer">เพิ่มผู้ใช้งาน</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    // Handlers
    window.logout = function() {
      state.user = null;
      setSession(null);
      render();
    };

    window.setTab = function(t) {
      state.tab = t;
      render();
    };

    window.setSearch = function(s) {
      state.search = s;
      render();
    };

    window.setFilterUrgency = function(u) {
      state.filterUrgency = u;
      render();
    };

    window.setFilterStatus = function(st) {
      state.filterStatus = st;
      render();
    };

    window.openViewer = function(docId) {
      state.viewDoc = state.docs.find(d => d.id === docId);
      render();
    };

    window.closeViewer = function() {
      state.viewDoc = null;
      render();
    };

    window.acknowledgeDoc = function(docId) {
      const doc = state.docs.find(d => d.id === docId);
      if (doc && !doc.readStatus.includes(state.user.id)) {
        doc.readStatus.push(state.user.id);
        saveDocs(state.docs);
        render();
      }
    };

    window.openCreateDocModal = function() {
      state.showCreateModal = true;
      render();
      document.getElementById('createDocForm').onsubmit = function(e) {
        e.preventDefault();
        const newDoc = {
          id: 'DOC-2026-' + String(state.docs.length + 1).padStart(3, '0'),
          title: document.getElementById('newTitle').value.trim(),
          fileUrl: document.getElementById('newUrl').value.trim() || 'https://drive.google.com/file/d/1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgvE2upms/preview',
          urgencyLevel: document.getElementById('newUrgency').value,
          category: document.getElementById('newCategory').value.trim() || 'General Policy',
          startDate: document.getElementById('newStartDate').value,
          endDate: document.getElementById('newEndDate').value,
          description: document.getElementById('newDesc').value.trim() || 'นโยบายและระเบียบปฏิบัติองค์กร',
          targetAudience: 'All',
          readStatus: []
        };
        state.docs.unshift(newDoc);
        saveDocs(state.docs);
        state.showCreateModal = false;
        render();
      };
    };

    window.closeCreateDocModal = function() {
      state.showCreateModal = false;
      render();
    };

    window.openEditUserModal = function(id) {
      state.editUserModal = state.users.find(u => u.id === id);
      render();
      document.getElementById('editUserForm').onsubmit = function(e) {
        e.preventDefault();
        const u = state.editUserModal;
        u.name = document.getElementById('editName').value.trim();
        u.role = document.getElementById('editRole').value;
        u.department = document.getElementById('editDept').value.trim();
        u.email = document.getElementById('editEmail').value.trim();
        u.pin = document.getElementById('editPin').value.trim();
        saveUsers(state.users);
        state.editUserModal = null;
        render();
      };
    };

    window.closeEditUserModal = function() {
      state.editUserModal = null;
      render();
    };

    window.openAddUserModal = function() {
      state.showAddUserModal = true;
      render();
      document.getElementById('addUserForm').onsubmit = function(e) {
        e.preventDefault();
        const id = document.getElementById('addId').value.trim().toUpperCase();
        if (state.users.some(u => u.id === id)) {
          alert('รหัสพนักงานนี้มีอยู่ในระบบแล้ว');
          return;
        }
        const newUser = {
          id: id,
          name: document.getElementById('addName').value.trim(),
          role: document.getElementById('addRole').value,
          department: document.getElementById('addDept').value.trim() || 'General Staff',
          email: document.getElementById('addEmail').value.trim() || `${id.toLowerCase()}@corporation.com`,
          pin: document.getElementById('addPin').value.trim() || id
        };
        state.users.push(newUser);
        saveUsers(state.users);
        state.showAddUserModal = false;
        render();
      };
    };

    window.closeAddUserModal = function() {
      state.showAddUserModal = false;
      render();
    };

    window.deleteUser = function(id) {
      if (confirm(`คุณต้องการลบผู้ใช้งานรหัส ${id} ออกจากระบบใช่หรือไม่?`)) {
        state.users = state.users.filter(u => u.id !== id);
        saveUsers(state.users);
        render();
      }
    };

    // Initial render
    render();
  </script>
</body>
</html>
